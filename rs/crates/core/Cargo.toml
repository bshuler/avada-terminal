[package]
name = "avada-core"
version = "0.0.0"
edition = "2021"
# 1.89: std File::try_lock (unix single-instance detector). Toolchains in play are 1.95+.
rust-version = "1.89"
publish = false

# Dependencies are PRE-DECLARED by the fan-out scaffold so no track edits this file
# (a parallel Cargo.toml edit would collide at merge). Need another crate or feature?
# STOP and ask the orchestrator — it's a checkpoint, not a unilateral edit.
# ---- track G10 commercial
# The edition switch (docs/modules-fanout-plan.md §2 "Free vs commercial"). It pulls in
# NO crate on purpose: the private `avada-commercial` crate depends on this one and
# installs its verifier and precompiled loader at startup, so the free build has no git
# dependency it cannot resolve offline and there is no cycle between the two crates.
# Turning it on changes policy only — which modules may install, and whether a missing
# precompiled loader is a bug or the expected state.
[features]
default = []
commercial = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Structured logging for every process role; `env-filter` parses `AVADA_LOG`
# directives, `fmt` writes the size-rotated file (crate::logging).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "registry"] }

# --- Wave 1: live backend ---
# session-engine: PTY + terminal model
portable-pty = "0.9"
alacritty_terminal = "0.26"
# async runtime (ai scheduler/client; the live core broadly)
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "process", "fs"] }
# ai: Ollama HTTP client (rustls to avoid an OpenSSL build dep on Windows)
# `stream` is for the speech-model download (stt/whisper.rs): a 142 MB body is written
# to disk chunk by chunk with a progress counter, not buffered whole in memory.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# persistence-cli: userData dir + ids
directories = "5"
uuid = { version = "1", features = ["v4"] }
# --- Wave 2: control server (HTTP + WS) ---
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
subtle = "2"      # constant-time master-token compare (timingSafeEqual parity)
# 32-random-byte hex master token. 0.10 to match the app crate (rs/crates/app) — one
# `rand` in the graph instead of a 0.8 here and a 0.10 there. `thread_rng` is the feature
# behind `rand::rng()`, the OS-seeded ChaCha CSPRNG the token draws from.
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng", "thread_rng"] }
# --- Phase 2: durable work queue (control/work.rs) ---
# SQLite-with-WAL is the design's chosen store (atomic competing-consumers claim,
# indexed visibility-timeout reap, count-by-state); `bundled` compiles the
# amalgamation so the queue ships inside the single native binary (no libsqlite3
# system dep) — consistent with the single-binary goal of the native rewrite.
rusqlite = { version = "0.32", features = ["bundled"] }

# --- dictation: in-process microphone capture (stt/native.rs) ---
# The "batteries included" recorder. Everything else in stt/backend.rs shells out to a
# tool the user had to install first (ffmpeg, sox, arecord); cpal talks to CoreAudio,
# WASAPI and ALSA directly, so the mic button works on a machine with nothing on it.
# Cost, stated plainly: a Linux *build* now needs `libasound2-dev` (alsa-sys is
# pkg-config'd, there is no vendored path). CI and scripts/gui-harness/Dockerfile
# install it. At *runtime* Linux needs only libasound.so.2, which every desktop that
# has sound already has.
cpal = "0.18"
# WAV encoding. The recorder has to write the header length itself now that no external
# tool is doing it, which is the one thing a killed ffmpeg used to get wrong.
hound = "3.5"

# --- dictation: in-process transcription (stt/whisper.rs) ---
# The second half of "batteries included". whisper-rs compiles whisper.cpp into this
# binary, so transcription is one code path on macOS, Windows and Linux and needs no
# `whisper` / `whisper-cli` on PATH. The weights are not vendored — a ~142 MB model is
# fetched once, on the first dictation, and cached; everything after that is offline.
# Cost, stated plainly: CI now builds C++ (cmake + a C++ toolchain + libclang for
# bindgen, all already present on the three runners) and the binary grows by a few MB.
whisper-rs = { version = "0.16", default-features = false }
# SHA-256 for the downloaded model. A 142 MB blob fetched over the network and then fed
# to a C++ inference engine is exactly the thing that should be checked against a pinned
# digest before it is opened.
sha2 = "0.10"

# --- Wave 0: module host (docs/modules-fanout-plan.md, track W0) ---
# The contract crate every module and the host share: manifest, capabilities, JSON-RPC
# framing, install records, lockfile, route descriptors. Path dep; never published alone.
avada-module-sdk = { path = "../module-sdk" }
# avada.toml and modules.lock parsing on the host side.
toml = "0.8"
# Install-record MAC (rights.rs) — the host signs what the user accepted with a key held
# in the OS keychain so a hand-edited record is refused.
hmac = "0.12"
# Version ranges in manifests and the lockfile.
semver = { version = "1", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }

# --- Wave 3 (orchestrator-added; docs/modules-fanout-plan.md §5 Wave 3) ---
# G6 resolver: identity + shape dependency resolution (install/resolver.rs).
pubgrub = "0.4"
# G8 licensing: EdDSA JWT verify + the in-process stub issuer (license/). jsonwebtoken
# carries ring for Ed25519 verification; ed25519-dalek mints the stub issuer's keys and
# verifies minisign-format signatures for G7's Linux notarization policy (policy/).
jsonwebtoken = "9"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
base64 = "0.22"

# platform: single-instance (named mutex + named-pipe argv handoff)
# 0.58 -> 0.62 to unify with the app + wgpu-hal 29 (avoids two `windows` crate versions).
# Target-gated so Linux/macOS builds never pull the Win32 bindings.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_IO",
  "Win32_Security_Credentials",
] }

# platform: SCM_RIGHTS descriptor passing for the daemon live-upgrade handoff
# (session/handoff.rs). std's ancillary-data API is still unstable
# (`unix_socket_ancillary_data`), so the sendmsg/recvmsg calls need raw libc.
# Already in the tree via portable-pty; declared here because we call it directly.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
