[package]
name = "avada-markdown-parse"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "The block-level markdown parser, shared by the app's built-in preview and the avada-markdown module."

[dependencies]
avada-module-sdk = { path = "../module-sdk" }
tracing = "0.1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
