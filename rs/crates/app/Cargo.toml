[package]
name = "avada"
version = "0.2.4"
edition = "2021"
license = "MIT"
description = "Tiled terminal workspace with AI-pane orchestration"
rust-version = "1.85"
publish = false

# Standalone workspace root (the GUI binary; owns the heavy Slint/GPU deps). You OWN this
# file — adjust deps freely. Path-deps into the core + the terminal widget.
[workspace]

[[bin]]
name = "avada"
path = "src/main.rs"

# The commercial edition is built with `--features commercial`; it forwards to the core
# switch and adds no dependency here either. The private `avada-commercial` crate is what
# supplies the strict verifier and the precompiled loader, and it depends on this repo
# rather than being depended on by it (see crates/core/Cargo.toml).
[features]
default = []
commercial = ["avada-core/commercial"]

[dependencies]
avada-core = { path = "../core" }
avada-terminal-widget = { path = "../terminal-widget" }
# `raw-window-handle-06` exposes the native HWND (for the frameless-window Win32 glue).
# Pinned to upstream slint-ui/slint master rev 9463a107 — back on upstream now that every fix we
# carried in the fork has landed there: `PopupWindow.is-open` (#12000, merged; fixed in the compiler
# `move_declarations`/`visit_all_named_references` passes — i.e. our COMPILED slint-build path) + the
# femtovg-wgpu Wayland first-frame `Surface::configure` panic fix (#12099, merged) + the matching
# skia-wgpu fix (#12100, merged — its merge commit IS this rev). Pinned by rev (not branch) to stop
# master drift; bump deliberately. No tagged release carries the wgpu fix yet (v1.16.1 predates it).
# Slint master's femtovg-wgpu renderer links wgpu 29, so we use `unstable-wgpu-29`.
# Slint's default features minus `accessibility`: accesskit pins `windows 0.58`, which collides with
# wgpu-hal 29's `windows 0.62` (gpu-allocator's loose range gets dragged down to 0.58). Dropping
# accessibility lets gpu-allocator resolve up to 0.62 and unify with wgpu-hal. Must match the
# terminal-widget crate (feature unification is additive across the workspace).
slint = { git = "https://github.com/slint-ui/slint", rev = "9463a107aeb5f5021c162e82c55977c5333229ae", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
    "unstable-wgpu-29",
    "renderer-femtovg-wgpu",
    "raw-window-handle-06",
    # Linux chrome ops must go through the winit window object (Wayland has no global-handle
    # protocol); this exposes the slint::winit_030 accessor. Additive — no behavior change
    # on Windows/macOS.
    "unstable-winit-030",
] }
raw-window-handle = "0.6"
# Clipboard writes from the crash reporter ("Send diagnostics" → copy full report). The
# terminal-widget already vendors arboard; the crash reporter is a separate code path here.
arboard = "3"
# Encode a clipboard image (arboard RGBA) → PNG when attaching it to a goal (already in the
# dep tree via slint). Pure Rust, no C deps.
png = "0.18"
# Decode attached goal images (any of the picker's formats) back to RGBA to re-paste them via
# the OS clipboard on goal delivery. Already in the tree via slint; decoders only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# "net" and "io-util" are for the embedded SSH server (src/ssh/): a TcpListener plus the
# AsyncRead/AsyncWrite russh drives. They would arrive implicitly through russh's own tokio
# dependency, but every feature this crate's own code calls is declared here explicitly.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
# Wave-2 preferences persistence (a small native-settings.json blob).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Log macros + `#[instrument]`; the subscriber is installed by avada_core::logging.
tracing = "0.1"
# Self-update (Task 8): a blocking GitHub-Releases check + installer download, run on a
# dedicated background thread (never the UI thread). `blocking` over the already-present
# (via core) reqwest; rustls-tls to avoid an OpenSSL build dep on Windows.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# `avada pair` terminal QR for mobile-app pairing (pure Rust, no image backend).
qrcode = { version = "0.14", default-features = false }
# Native Open/Save file dialogs: see the per-target rfd declarations below (Windows needs
# no backend feature; Linux/macOS need one, so the dep is target-split).
# Frameless window / custom titlebar (strip WS_CAPTION + the HTCAPTION drag trick + min/max/close)
# — lifted from spike-tearoff. Bumped 0.58 -> 0.62 to unify with wgpu-hal 29 / gpu-allocator and
# avoid two `windows` crate versions in the graph (which breaks wgpu-hal's d3d12 backend).
# Target-gated so Linux/macOS builds never pull the Win32 bindings.
[target.'cfg(windows)'.dependencies]
# Native Open/Save dialogs via the COM IFileDialog (`windows-sys`, separate from the
# `windows` crate below so it doesn't perturb the pinned 0.62 graph); no backend feature
# needed on Windows.
rfd = { version = "0.15", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # GetLocalTime — reminder panes need the LOCAL wall clock ("tomorrow 9am", due labels).
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# X11 global pointer (QueryPointer) for cross-window pane tear-off + the override-redirect
# drag ghost. Pure-Rust XCB, no C deps. Linux only (the unix-minus-macos cfg).
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
x11rb = "0.13"

# AppKit bindings for the macOS window chrome (hidden titlebar + traffic lights), cursors,
# and the NSEvent-based global pointer for cross-window tear-off. Validated green on the
# mini by track T3 — feature names track AppKit header names.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSArray", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSWindow", "NSResponder", "NSView", "NSEvent", "NSCursor", "NSScreen", "NSApplication", "NSColor", "NSGraphics", "NSGraphicsContext", "NSPasteboard"] }

# Unix local wall clock (`localtime_r`) for reminder due-times — epoch math is UTC and
# would put "tomorrow 9am" off by the timezone offset.
[target.'cfg(unix)'.dependencies]
# --- M3: the embedded SSH server (docs/mux-backend-plan.md) ---
# russh is the SSH *server* half of `src/ssh/`. Pinned to a patch line (the exact build is
# nailed by Cargo.lock). russh hard-requires one of two crypto backends (it `compile_error!`s
# without one); `default-features = false` drops the default `aws-lc-rs`, which pulls in a
# cmake/C toolchain requirement on every build host, and `ring` is enabled in its place —
# it ships prebuilt asm and needs no cmake. `rsa` is re-enabled because plenty of people
# still carry an RSA key on their phone. Compression is left off: an attach stream is
# already tiny, and `flate2` is one more parser exposed pre-auth.
russh = { version = "0.63.1", default-features = false, features = ["ring", "rsa"] }
# The key formats themselves (OpenSSH private keys, `authorized_keys` public keys,
# fingerprints). Re-exported by russh as `russh::keys::ssh_key`, but named here because we
# call it directly and every non-stdlib dependency is declared explicitly.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "alloc", "ed25519", "encryption"] }
# Host-key generation needs a CSPRNG. `sys_rng` is the OS entropy source (getrandom); the
# thread/std RNGs are deliberately not enabled — a host key must come from the OS.
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }
libc = "0.2"
# rfd requires picking a backend off-Windows: xdg-portal (no GTK dev-dep) + tokio (its
# portal transport needs an async runtime, and tokio is already in the tree).
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", rev = "9463a107aeb5f5021c162e82c55977c5333229ae" }

# Keep the software renderer + UI smooth in dev (matches the terminal-widget profile).
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
debug = "line-tables-only"
opt-level = 1

# ---------------------------------------------------------------------------
# Linux distro packaging (deb via `cargo deb`, rpm via `cargo generate-rpm`).
# Built by rs/packaging/{deb,rpm}.sh. FHS layout: the binary goes to /usr/bin and the
# shell-integration scripts to /usr/share/avada/resources/shell-integration — found by
# the prefix-relative candidate in core::shell_integration::shell_integration_dir(). Asset
# `source` paths are relative to THIS manifest dir (rs/crates/app). Keep both asset lists in
# sync; they mirror the AppDir that rs/packaging/appimage.sh assembles.
[package.metadata.deb]
maintainer = "Eyal Mizrachi <eyal@sunsationsusa.com>"
copyright = "2026 Eyalm321, MIT"
section = "utils"
priority = "optional"
extended-description = "Avada is a native tiled terminal workspace with tabs-as-workspaces, pane drag/tear-off, clickable paths, and AI-pane orchestration over a control API."
depends = "libc6, libfontconfig1, libfreetype6, libxkbcommon0"
assets = [
    ["target/release/avada", "/usr/bin/avada", "755"],
    ["../../../resources/shell-integration/hp-init.sh", "/usr/share/avada/resources/shell-integration/hp-init.sh", "644"],
    ["../../../resources/shell-integration/hp-init.ps1", "/usr/share/avada/resources/shell-integration/hp-init.ps1", "644"],
    ["../../../resources/shell-integration/zdotdir/.zshenv", "/usr/share/avada/resources/shell-integration/zdotdir/.zshenv", "644"],
    ["../../../resources/shell-integration/zdotdir/.zshrc", "/usr/share/avada/resources/shell-integration/zdotdir/.zshrc", "644"],
    ["../../../resources/claude/hp-claude-session-hook.sh", "/usr/share/avada/resources/claude/hp-claude-session-hook.sh", "755"],
    ["../../../resources/cursor/hp-cursor-session-hook.sh", "/usr/share/avada/resources/cursor/hp-cursor-session-hook.sh", "755"],
    ["../../../resources/copilot/hp-copilot-session-hook.sh", "/usr/share/avada/resources/copilot/hp-copilot-session-hook.sh", "755"],
    ["../../../resources/codex/hp-codex-session-hook.sh", "/usr/share/avada/resources/codex/hp-codex-session-hook.sh", "755"],
    ["../../../resources/gemini/hp-gemini-session-hook.sh", "/usr/share/avada/resources/gemini/hp-gemini-session-hook.sh", "755"],
    ["../../../resources/claude/goal-orchestrator/SKILL.md", "/usr/share/avada/resources/claude/goal-orchestrator/SKILL.md", "644"],
    ["../../../resources/claude/goal-orchestrator/SPEC.md", "/usr/share/avada/resources/claude/goal-orchestrator/SPEC.md", "644"],
    ["../../../resources/claude/goal-orchestrator/IMPL.md", "/usr/share/avada/resources/claude/goal-orchestrator/IMPL.md", "644"],
    ["../../packaging/linux/avada.desktop", "/usr/share/applications/avada.desktop", "644"],
    ["../../packaging/linux/avada-mime.xml", "/usr/share/mime/packages/avada.xml", "644"],
    ["../../packaging/linux/icons/hicolor/16x16/apps/avada.png", "/usr/share/icons/hicolor/16x16/apps/avada.png", "644"],
    ["../../packaging/linux/icons/hicolor/32x32/apps/avada.png", "/usr/share/icons/hicolor/32x32/apps/avada.png", "644"],
    ["../../packaging/linux/icons/hicolor/48x48/apps/avada.png", "/usr/share/icons/hicolor/48x48/apps/avada.png", "644"],
    ["../../packaging/linux/icons/hicolor/64x64/apps/avada.png", "/usr/share/icons/hicolor/64x64/apps/avada.png", "644"],
    ["../../packaging/linux/icons/hicolor/128x128/apps/avada.png", "/usr/share/icons/hicolor/128x128/apps/avada.png", "644"],
    ["../../packaging/linux/icons/hicolor/256x256/apps/avada.png", "/usr/share/icons/hicolor/256x256/apps/avada.png", "644"],
    ["../../packaging/linux/icons/hicolor/512x512/apps/avada.png", "/usr/share/icons/hicolor/512x512/apps/avada.png", "644"],
]

[package.metadata.generate-rpm]
summary = "Tiled terminal workspace with AI-pane orchestration"
# No find-requires on the build host (Fedora rpm-build tooling not assumed) — skip auto deps.
auto-req = "no"
requires = { fontconfig = "*", freetype = "*", libxkbcommon = "*" }
assets = [
    { source = "target/release/avada", dest = "/usr/bin/avada", mode = "0755" },
    { source = "../../../resources/shell-integration/hp-init.sh", dest = "/usr/share/avada/resources/shell-integration/hp-init.sh", mode = "0644" },
    { source = "../../../resources/shell-integration/hp-init.ps1", dest = "/usr/share/avada/resources/shell-integration/hp-init.ps1", mode = "0644" },
    { source = "../../../resources/shell-integration/zdotdir/.zshenv", dest = "/usr/share/avada/resources/shell-integration/zdotdir/.zshenv", mode = "0644" },
    { source = "../../../resources/shell-integration/zdotdir/.zshrc", dest = "/usr/share/avada/resources/shell-integration/zdotdir/.zshrc", mode = "0644" },
    { source = "../../../resources/claude/hp-claude-session-hook.sh", dest = "/usr/share/avada/resources/claude/hp-claude-session-hook.sh", mode = "0755" },
    { source = "../../../resources/cursor/hp-cursor-session-hook.sh", dest = "/usr/share/avada/resources/cursor/hp-cursor-session-hook.sh", mode = "0755" },
    { source = "../../../resources/copilot/hp-copilot-session-hook.sh", dest = "/usr/share/avada/resources/copilot/hp-copilot-session-hook.sh", mode = "0755" },
    { source = "../../../resources/codex/hp-codex-session-hook.sh", dest = "/usr/share/avada/resources/codex/hp-codex-session-hook.sh", mode = "0755" },
    { source = "../../../resources/gemini/hp-gemini-session-hook.sh", dest = "/usr/share/avada/resources/gemini/hp-gemini-session-hook.sh", mode = "0755" },
    { source = "../../../resources/claude/goal-orchestrator/SKILL.md", dest = "/usr/share/avada/resources/claude/goal-orchestrator/SKILL.md", mode = "0644" },
    { source = "../../../resources/claude/goal-orchestrator/SPEC.md", dest = "/usr/share/avada/resources/claude/goal-orchestrator/SPEC.md", mode = "0644" },
    { source = "../../../resources/claude/goal-orchestrator/IMPL.md", dest = "/usr/share/avada/resources/claude/goal-orchestrator/IMPL.md", mode = "0644" },
    { source = "../../packaging/linux/avada.desktop", dest = "/usr/share/applications/avada.desktop", mode = "0644" },
    { source = "../../packaging/linux/avada-mime.xml", dest = "/usr/share/mime/packages/avada.xml", mode = "0644" },
    { source = "../../packaging/linux/icons/hicolor/16x16/apps/avada.png", dest = "/usr/share/icons/hicolor/16x16/apps/avada.png", mode = "0644" },
    { source = "../../packaging/linux/icons/hicolor/32x32/apps/avada.png", dest = "/usr/share/icons/hicolor/32x32/apps/avada.png", mode = "0644" },
    { source = "../../packaging/linux/icons/hicolor/48x48/apps/avada.png", dest = "/usr/share/icons/hicolor/48x48/apps/avada.png", mode = "0644" },
    { source = "../../packaging/linux/icons/hicolor/64x64/apps/avada.png", dest = "/usr/share/icons/hicolor/64x64/apps/avada.png", mode = "0644" },
    { source = "../../packaging/linux/icons/hicolor/128x128/apps/avada.png", dest = "/usr/share/icons/hicolor/128x128/apps/avada.png", mode = "0644" },
    { source = "../../packaging/linux/icons/hicolor/256x256/apps/avada.png", dest = "/usr/share/icons/hicolor/256x256/apps/avada.png", mode = "0644" },
    { source = "../../packaging/linux/icons/hicolor/512x512/apps/avada.png", dest = "/usr/share/icons/hicolor/512x512/apps/avada.png", mode = "0644" },
]

# Headless Slint driver for the UI-layer end-to-end tests: builds the real component tree,
# finds real elements by their accessible label and clicks them, with no window and no
# window-server connection — so these run in CI and never steal focus on a dev machine.
[dev-dependencies]
i-slint-backend-testing = { git = "https://github.com/slint-ui/slint", rev = "9463a107aeb5f5021c162e82c55977c5333229ae", features = ["internal"] }
# Test-only, for one assertion that cannot be made any other way: `StyledText::paragraphs`
# is `pub(crate)`, so from outside Slint there is no way to read back what
# `from_markdown` parsed — and the whole `highlight` module rests on the claim that its
# markup reproduces the source line byte for byte. `get_raw_text` is the public function
# that answers it. Same pinned rev as `slint` itself, so cargo unifies the two.
i-slint-core = { git = "https://github.com/slint-ui/slint", rev = "9463a107aeb5f5021c162e82c55977c5333229ae" }
