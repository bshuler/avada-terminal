[package]
name = "avada-json-parse"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "The order-preserving JSON tree flattener, shared by the app's built-in data view and the avada-datatree module."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
