[package]
name = "avada-module-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "The contract every Avada Terminal module is written against: manifest, JSON-RPC handshake, capabilities, rights, install records, route descriptors, rail entries, skills, licenses."
publish = false

# This crate is FROZEN after Wave 0 (docs/modules-fanout-plan.md §6). A change here is a
# contract version bump, orchestrator only. It is public and source-only by design: a
# module author reads it with `cargo doc`, and the free edition compiles modules against
# it, so it must never depend on anything a module could not also build.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The manifest (`avada.toml`) and the lockfile are TOML.
toml = "0.8"
# Module versions, dependency ranges, extension-point shape versions.
semver = { version = "1", features = ["serde"] }
# Install records are HMAC-SHA256 over canonical JSON with a key core keeps in the OS
# keychain (rights come from the record, never from the manifest on disk).
hmac = "0.12"
sha2 = "0.10"
