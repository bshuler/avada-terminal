[package]
name = "avada-git"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "The Git rail entry for Avada Terminal"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "avada-git"
path = "src/main.rs"

[dependencies]
avada-module-sdk = { path = "../../crates/module-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
