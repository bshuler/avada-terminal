[package]
name = "avada-editor"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A modal text editor pane for Avada Terminal, with Helix, Vim and modeless keymaps"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "avada-editor"
path = "src/main.rs"

[dependencies]
# Pinned to a rev, not a branch: a module is built by the host from source at install
# time, and "whatever main says today" would make a build that worked yesterday fail
# tomorrow for reasons nothing in this repo changed. Bump it deliberately.
#
# b831bd2 is the commit that added `avada_module_sdk::grid` — the tier-5 surface this
# module is built on. Nothing older will compile against it.
avada-module-sdk = { path = "../../crates/module-sdk" }
# The rope Helix itself uses. See README "Why ropey and not helix-core".
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
