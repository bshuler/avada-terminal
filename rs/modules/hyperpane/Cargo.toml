[package]
name = "avada-hyperpane"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "The Hyperpane module for Avada Terminal: the always-on agent tab and the rule that teaches it to drive the app"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "avada-hyperpane"
path = "src/main.rs"

[dependencies]
# Pinned to a rev, not a branch: a module is built by the host from source at install
# time, and "whatever main says today" would make a build that worked yesterday fail
# tomorrow for reasons nothing in this repo changed. Bump it deliberately.
avada-module-sdk = { path = "../../crates/module-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
