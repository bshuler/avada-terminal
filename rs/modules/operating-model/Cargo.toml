[package]
name = "avada-operating-model"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "The Operating Model module for Avada Terminal: the always-on rule and role playbooks for managed agents"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "avada-operating-model"
path = "src/main.rs"

[dependencies]
avada-module-sdk = { path = "../../crates/module-sdk" }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
