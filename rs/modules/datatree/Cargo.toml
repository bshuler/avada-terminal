[package]
name = "avada-datatree"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A foldable JSON/JSONL tree pane for Avada Terminal"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "avada-datatree"
path = "src/main.rs"

[dependencies]
# Built by the host from source at install time, same as every module. The flattener is a
# workspace crate rather than a copy: the app's built-in tree view and this module must
# agree line-for-line and fold-for-fold, and one crate is the only way to keep them from
# drifting.
avada-module-sdk = { path = "../../crates/module-sdk" }
avada-json-parse = { path = "../../crates/json-parse" }
serde_json = "1"

[dev-dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
