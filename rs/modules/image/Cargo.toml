[package]
name = "avada-image"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A raster image pane for Avada Terminal"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "avada-image"
path = "src/main.rs"

[dependencies]
# Built by the host from source at install time, same as every module. The decoder is a
# workspace crate rather than a copy: the app's built-in image view and this module must
# sniff the same containers and answer with the same error text, and one crate is the only
# way to keep them from drifting.
avada-module-sdk = { path = "../../crates/module-sdk" }
avada-image-decode = { path = "../../crates/image-decode" }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
libc = "0.2"
# The e2e test builds real PNGs at test time so it needs no fixture files — the same
# encoder `avada-image-decode`'s own tests use.
png = "0.18"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
