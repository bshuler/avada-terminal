[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/module-sdk",
    "crates/markdown-parse",
    "crates/csv-parse",
    "modules/files",
    "modules/git",
    "modules/tools",
    "modules/workspace",
    "modules/hyperpane",
    "modules/editor",
    "modules/markdown",
    "modules/marketplace",
    "modules/table",
]
# The spikes are throwaway, heavy-dependency (Slint/wgpu) crates owned entirely by
# their own fan-out track. Each declares its own `[workspace]` so it never drags
# the lean core build, and is excluded here for clarity.
exclude = ["spikes/terminal-render", "spikes/tearoff"]

[profile.dev]
debug = "line-tables-only"
